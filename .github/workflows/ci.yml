name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        shell: bash
        run: |
          export SYNTH_FIXTURE_ROOT="${GITHUB_WORKSPACE}"
          if [ -x build/golden_runner ]; then
            ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build -C Debug --output-on-failure
          fi

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with sanitizers
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DSYNTH_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-asan

      - name: Test under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          SYNTH_FIXTURE_ROOT: ${{ github.workspace }}
        run: ctest --test-dir build-asan --output-on-failure
