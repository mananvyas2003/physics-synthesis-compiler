name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        shell: bash
        run: |
          export SYNTH_FIXTURE_ROOT="${GITHUB_WORKSPACE}"
          export SYNTH_ALLOW_IR_PARTS=1
          if [ -x build/golden_runner ]; then
            ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build -C Debug --output-on-failure
          fi

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with sanitizers
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DSYNTH_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-asan

      - name: Test under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          SYNTH_FIXTURE_ROOT: ${{ github.workspace }}
          SYNTH_ALLOW_IR_PARTS: "1"
        run: ctest --test-dir build-asan --output-on-failure

  kicad-erc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

      - name: Install KiCad CLI
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kicad || \
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kicad-cli || true
          command -v kicad-cli
          kicad-cli version || kicad-cli --version || true

      - name: Real KiCad ERC (divider + compose-gate4)
        env:
          SYNTH_FIXTURE_ROOT: ${{ github.workspace }}
          SYNTH_BIN: ${{ github.workspace }}/build/synth
          # Seed/fixture IR embeds parts[]; keep inserting them even if a catalogue is set.
          SYNTH_ALLOW_IR_PARTS: "1"
        run: |
          chmod +x scripts/run_kicad_erc.sh
          scripts/run_kicad_erc.sh "${GITHUB_WORKSPACE}/out_erc"

      - name: Upload ERC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-erc-reports
          path: out_erc/**/*.rpt
          if-no-files-found: ignore
